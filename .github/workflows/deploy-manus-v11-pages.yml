name: Deploy Landing by Manus V1.1 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Landing by Manus V1.1/**"
      - ".github/workflows/deploy-manus-v11-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Landing by Manus V1.1
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./Landing by Manus V1.1"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
