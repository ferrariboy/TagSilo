<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkTag Pro Workspace</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    
    <!-- Top Header -->
    <header class="popup-header">
      <div class="brand-wrapper">
        <img src="icons/icon-48.png" alt="LinkTag Logo" class="brand-logo">
        <h1 class="brand-title">LinkTag Pro</h1>
      </div>
      <button id="openOptionsBtn" class="icon-btn" title="Open Settings & Tag Manager">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>
    </header>

    <!-- Scrollable Main Content -->
    <main class="popup-content">
      
      <!-- Target Profile Card with Avatar -->
      <section class="glass-card">
        <div class="card-label">
          <span>Target Profile</span>
          <button id="refreshMetaBtn" class="icon-btn" title="Refresh Profile Data">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
          </button>
        </div>
        <div class="profile-header-row">
          <img id="profileAvatar" class="profile-avatar" alt="Profile Avatar" referrerpolicy="no-referrer" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%2394a3b8' viewBox='0 0 24 24'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
          <div class="profile-meta-text">
            <div id="profileName" class="profile-name">Extracting Metadata...</div>
            <div id="profileTitle" class="profile-title">Scanning JSON-LD & Page Title</div>
          </div>
        </div>
        <div id="profileUrl" class="profile-url-badge">https://linkedin.com</div>
        <div id="profileEmail" class="profile-url-badge" style="background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.25); color: #6ee7b7;">Email: Searching...</div>
        <div id="alreadyTaggedBanner" class="already-tagged-banner">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <div class="tagged-info-text">
            <strong style="display: block; font-size: 0.775rem;">Already Tagged</strong>
            <span id="taggedDateText" style="font-size: 0.7rem; opacity: 0.9;">Record found on Google Sheets</span>
          </div>
        </div>
      </section>

      <!-- Pipeline Group Selection Dropdown -->
      <section class="glass-card">
        <div class="card-label">
          <span>Pipeline Group</span>
        </div>
        <select id="groupSelect" class="glass-select">
          <option value="">-- Select a Pipeline Group --</option>
        </select>
      </section>

      <!-- Active Tag Box -->
      <section class="glass-card">
        <div class="card-label">
          <span>Active Tags (<span id="activeCount">0</span>)</span>
        </div>
        <div id="activeTagsBox" class="active-tags-box">
          <span class="empty-tags-hint">No tags attached. Select quick tags below!</span>
        </div>
        <div class="custom-tag-row">
          <input type="text" id="customActiveTagInput" class="mini-input" placeholder="Add custom tag..." maxlength="25">
          <button id="addActiveTagBtn" class="mini-add-btn">+ Add</button>
        </div>
      </section>

      <!-- Quick Add Tags Grid -->
      <section class="glass-card">
        <div class="card-label">
          <span>Quick Add Tags</span>
        </div>
        <div id="quickTagsGrid" class="quick-tags-grid">
          <!-- Quick tag pills populated from storage -->
        </div>
      </section>

      <!-- Custom Notes Canvas -->
      <section class="glass-card">
        <div class="card-label">
          <span>Notes & Context</span>
        </div>
        <textarea id="notesTextarea" class="notes-textarea" placeholder="Add custom contact notes, mutual connections, or follow-up tasks..."></textarea>
      </section>

    </main>

    <!-- Footer Actions -->
    <footer class="popup-footer">
      <div id="statusAlert" class="status-alert"></div>
      <button id="syncBtn" class="sync-btn">
        <span class="spinner"></span>
        <span id="syncBtnText">Sync to Google Sheets</span>
      </button>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
